services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: penflow
      POSTGRES_PASSWORD: penflow
      POSTGRES_DB: penflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - penflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penflow -d penflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  penflow-postgres:
